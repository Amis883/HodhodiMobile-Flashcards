<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Hodhodi">
<title>Hodhodi – Smart Flashcards</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f2f2f7;--card:#fff;--tx:#111;--mu:#6e6e73;--ac:#0a7aff;--ln:#d8d8dd;--red:#c0392b;--grn:#2e9e3e;--blu:#2f6bf0;--org:#d9822b;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--tx:#f2f2f7;--mu:#98989f;--ac:#4aa3ff;--ln:#38383a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--tx:#f2f2f7;--mu:#98989f;--ac:#4aa3ff;--ln:#38383a;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Helvetica Neue",Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;font-weight:600;font-size:18px;min-height:48px}
header button{font-size:16px}
main{flex:1;overflow-y:auto;padding:0 14px 16px}
nav{display:flex;border-top:1px solid var(--ln);background:var(--card)}
nav button{flex:1;padding:10px 0 8px;font-size:12px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px}
nav button.on{color:var(--ac)}
button{font:inherit;color:var(--ac);background:none;border:0;padding:6px 8px;cursor:pointer}
.row{background:var(--card);border-radius:12px;margin-bottom:8px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.row .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cn{display:flex;gap:12px;font-variant-numeric:tabular-nums;font-weight:600}
.n{color:var(--blu)}.l{color:var(--red)}.r{color:var(--grn)}.z{opacity:.25}
.sub{color:var(--mu);font-size:13px}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:27px;background:var(--ac);color:#fff;font-size:30px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.3);padding:0}
input,textarea,select{width:100%;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:10px;margin:4px 0 12px}
textarea{min-height:90px}
label{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.study{display:flex;flex-direction:column;height:100%}
.face{flex:1;background:var(--card);border-radius:14px;padding:22px;overflow-y:auto;font-size:22px;text-align:center;display:flex;flex-direction:column;justify-content:center;white-space:pre-wrap}
.face hr{width:100%;border:0;border-top:1px solid var(--ln);margin:18px 0}
.cl{color:var(--ac)}
.face img,.sheet img{max-width:100%;max-height:36vh;border-radius:10px;margin:8px auto;display:block;object-fit:contain}
.face audio,.sheet audio{width:100%;margin-top:8px}
.mb{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 8px}
.mb button{background:var(--card);border:1px solid var(--ln);border-radius:10px;font-size:14px}
.btns{display:flex;gap:8px;padding-top:10px}
.btns button{flex:1;border-radius:10px;color:#fff;padding:10px 2px;font-size:14px;line-height:1.25}
.show{width:100%;background:var(--ac);color:#fff;border-radius:10px;padding:14px;margin-top:10px;font-weight:600}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--ln);margin:10px 0}
.fc{display:flex;align-items:flex-end;gap:2px;height:110px;margin:10px 0}
.fc div{flex:1;background:var(--grn);min-height:1px;border-radius:2px 2px 0 0}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 20px;overflow-y:auto}
.card2{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
.paper{background:#e8e8e8 url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27200%27 height=%27200%27%3E%3Cfilter id=%27n%27%3E%3CfeTurbulence type=%27fractalNoise%27 baseFrequency=%27.8%27 numOctaves=%273%27/%3E%3CfeColorMatrix values=%270 0 0 0 .4 0 0 0 0 .4 0 0 0 0 .4 0 0 0 .2 0%27/%3E%3C/filter%3E%3Crect width=%27200%27 height=%27200%27 filter=%27url(%23n)%27/%3E%3C/svg%3E");padding:0 12px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .paper{background:#000}}
:root[data-theme="dark"] .paper{background:#000}
.tb{padding:0;font-weight:400;background:var(--card);border-bottom:1px solid var(--ln)}
.tb button{flex:1;padding:14px 0}
.paper .face{background:transparent;border-radius:0;justify-content:flex-start;padding:16px 4px;font-family:Helvetica,Arial,sans-serif}
.paper .btns,.paper .cnt{background:var(--card);margin:0 -12px;padding:10px 12px}
.cnt{text-align:center;font-size:26px;font-variant-numeric:tabular-nums;cursor:pointer}
.btns button{font-size:17px}
.study{position:relative}
.gear{position:absolute;right:0;bottom:84px;font-size:30px;color:var(--ac);padding:4px 8px}
.hdr{background:none;padding:2px 14px;color:var(--mu);margin-bottom:2px}.hdr .cn{gap:6px;font-size:13px}.cn span{min-width:34px;text-align:right}
.tl{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.4);display:flex;align-items:flex-end}
.tp{width:100%;background:#111;color:#eee;border-radius:16px 16px 0 0;padding:10px 14px calc(16px + env(safe-area-inset-bottom,0px))}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
[hidden]{display:none!important}
.tg button{background:#222;color:#eee;border-radius:10px;padding:14px 4px;font-size:15px}
.pr{display:flex;gap:10px;align-items:center;padding:9px 0;font-size:16px;text-transform:none;color:var(--tx)}.pr input{width:auto;margin:0}
.pr2{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0}.pr2 input,.pr2 select{width:auto;max-width:55%;margin:0}.pr2 input[type=number]{width:84px}
.pt{display:flex;overflow-x:auto;gap:4px;margin-bottom:10px}.pt button{white-space:nowrap;border-radius:8px;background:var(--card);font-size:14px}.pt button.on{background:var(--ac);color:#fff}
body.mm .gear,body.hb .cnt{display:none}body.lb .btns button{padding:20px 2px}body.rm *{animation:none!important;transition:none!important}
.acts{display:flex;justify-content:center;gap:8px;margin:14px 0}.acts a,.acts button{border:1px solid var(--ln);background:var(--card);border-radius:14px;padding:8px 12px;color:var(--tx);text-decoration:none;font-size:14px}
</style></head><body>
<div id="app"><header id="hd"></header><main id="mn"></main><nav id="nv"></nav></div>
<div id="sh" class="sheet" hidden></div>
<script>
const M=60000,D=86400000,KEY='cards-app-v1';
let S=null,V={tab:'decks',q:'',study:null,show:false};
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S){const n=Date.now();S={decks:[{id:1,name:'Default'}],nid:10,rev:{},cards:[
['What is spaced repetition?','Reviewing material at increasing intervals, just before you would forget it.'],
['The capital of Germany is {{c1::Berlin}}.',''],
['Which hook stores state in React?','useState']].map((a,i)=>({id:i+1,deck:1,front:a[0],back:a[1],tags:'sample',state:'new',step:0,ivl:0,ease:2.5,lapses:0,due:n,susp:0}))}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
let DB,E={},REC=null;
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const odb=()=>DB||(DB=new Promise((res,rej)=>{try{const r=indexedDB.open('cards-media',1);r.onupgradeneeded=()=>r.result.createObjectStore('m');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}));
const mput=async(id,b)=>{const d=await odb();return new Promise((res,rej)=>{const t=d.transaction('m','readwrite');t.objectStore('m').put(b,id);t.oncomplete=res;t.onerror=()=>rej(t.error)})};
const mget=async id=>{const d=await odb();return new Promise((res,rej)=>{const q=d.transaction('m').objectStore('m').get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})};
const mdel=async id=>{try{const d=await odb();d.transaction('m','readwrite').objectStore('m').delete(id)}catch(e){}};
async function hydrate(){for(const e of document.querySelectorAll('[data-m]')){if(e.getAttribute('src'))continue;try{const b=await mget(e.dataset.m);if(b){e.src=URL.createObjectURL(b);if(S.auto&&V.study!=null&&e.tagName=='AUDIO'&&e.dataset.sd==(V.show?'b':'f'))e.play().catch(()=>{})}}catch(x){}}}
const mediaHtml=(i,a,sd)=>(i?`<img data-m="${i}" alt="">`:'')+(a?`<audio data-m="${a}" data-sd="${sd||''}" ${O().playBtn?'controls':''} playsinline></audio>`:'');
const mi=s=>{const i=E[s+'i'],a=E[s+'a'];return `<button onclick="pick('${s}','i')">📷 ${i?'Change':'Image'}</button>${i?`<button onclick="rm('${s}i')">✕ image</button>`:''}<button id="rec-${s}" onclick="rec('${s}')">🎙 ${a?'Re-record':'Record'}</button><button onclick="pick('${s}','a')">🎵 File</button>${a?`<button onclick="rm('${s}a')">✕ audio</button>`:''}`};
const mbar=s=>`<div class="mb" id="mb-${s}">${mi(s)}</div><div id="mp-${s}"></div>`;
const prev=s=>{const e=$('mp-'+s);if(e){e.innerHTML=mediaHtml(E[s+'i'],E[s+'a']);hydrate()}};
const rb=s=>{$('mb-'+s).innerHTML=mi(s);prev(s)};
const newId=()=>'m'+Date.now()+Math.random().toString(36).slice(2,6);
function rm(k){delete E[k];rb(k[0])}
function shrink(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const r=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(),'image/jpeg',.75);URL.revokeObjectURL(u)};im.onerror=rej;im.src=u})}
function pick(s,k){const f=document.createElement('input');f.type='file';f.accept=k=='i'?'image/*':'audio/*';f.onchange=async()=>{const x=f.files[0];if(!x)return;try{const b=k=='i'?await shrink(x):x,id=newId();await mput(id,b);E[s+k]=id;rb(s)}catch(e){alert('Could not save that file')}};f.click()}
async function rec(s){const btn=$('rec-'+s);if(REC&&REC.state=='recording'){REC.stop();return}
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true}),mr=new MediaRecorder(st),ch=[];REC=mr;
  mr.ondataavailable=e=>e.data.size&&ch.push(e.data);
  mr.onstop=async()=>{st.getTracks().forEach(t=>t.stop());const b=new Blob(ch,{type:mr.mimeType||'audio/mp4'}),id=newId();try{await mput(id,b);E[s+'a']=id}catch(e){alert('Could not save the recording')}REC=null;rb(s)};
  mr.start();btn.textContent='⏹ Stop'}
 catch(e){alert('Microphone is not available here. Use the 🎵 File button to attach a voice memo instead.')}}
function speak(){const c=V.cur;if(!c||!window.speechSynthesis)return;let t=V.show?(hasCl(c.front)?c.front:(c.back||c.front)):c.front;t=t.replace(/\{\{c\d+::(.*?)(?:::.*?)?\}\}/g,V.show?'$1':'blank');const u=new SpeechSynthesisUtterance(t);u.rate=+O().rate||1;const vv=speechSynthesis.getVoices().find(v=>v.name==O().voice);if(vv)u.voice=vv;if(S.lang)u.lang=S.lang;speechSynthesis.cancel();speechSynthesis.speak(u)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hasCl=t=>/\{\{c\d+::/.test(t);
const cl=(t,sh)=>esc(t).replace(/\{\{c\d+::(.*?)(?:::.*?)?\}\}/g,(m,a)=>'<b class="cl">'+(sh?a:'[…]')+'</b>');
const eod=()=>{const s=O().dayStart*3600000,d=new Date(Date.now()-s);d.setHours(23,59,59,999);return d.getTime()+s};
const today=()=>new Date().toISOString().slice(0,10);
function fmt(ms){const m=ms/M;if(m<60)return Math.max(1,Math.round(m))+'m';if(m<1440)return Math.round(m/60)+'h';const d=m/1440;return d<30?Math.round(d)+'d':(d/30).toFixed(1).replace('.0','')+'mo'}
function nxt0(c,g){if(O().sched=='fsrs')return nxtF(c,g);const st=[1,10];let r={state:c.state,step:c.step||0,ivl:c.ivl||0,ease:c.ease||2.5,lapses:c.lapses||0,due:0};
 const grad=i=>{r.state='review';r.ivl=i;r.due=i*D};
 if(c.state!=='review'){
  if(g==1){r.state='learn';r.step=0;r.due=st[0]*M}
  else if(g==2){r.state='learn';r.due=(r.step==0?6:st[1])*M}
  else if(g==3){if(r.step+1<st.length){r.state='learn';r.step++;r.due=st[r.step]*M}else grad(1)}
  else grad(4)
 }else{
  if(g==1){r.lapses++;r.ease=Math.max(1.3,r.ease-.2);r.state='learn';r.step=1;r.ivl=1;r.due=10*M}
  else{const f=[0,0,1.2,r.ease,r.ease*1.3][g];if(g==2)r.ease=Math.max(1.3,r.ease-.15);if(g==4)r.ease+=.15;r.ivl=Math.max(r.ivl+1,Math.round(r.ivl*f));r.due=r.ivl*D}
 }return r}
const inDeck=d=>S.cards.filter(c=>!c.susp&&(d==null||c.deck==d));
function counts(d){const e=eod(),n=Date.now(),a=inDeck(d);return{n:Math.min(O().newPerDay,a.filter(c=>c.state=='new').length),l:a.filter(c=>c.state=='learn'&&c.due<=n+O().ahead*M).length,r:a.filter(c=>c.state=='review'&&c.due<=e).length}}
function queue(d){const n=Date.now(),e=eod(),a=inDeck(d);
 const L=a.filter(c=>c.state=='learn'&&c.due<=n).sort((x,y)=>x.due-y.due);
 const R=a.filter(c=>c.state=='review'&&c.due<=e).sort((x,y)=>x.due-y.due);
 const N=a.filter(c=>c.state=='new').slice(0,O().newPerDay);const LA=a.filter(c=>c.state=='learn'&&c.due>n&&c.due<=n+O().ahead*M).sort((x,y)=>x.due-y.due);return[...L,...R,...N,...LA]}
function answer(g){const c=V.cur,r=nxt(c,g);if(O().interrupt){document.querySelectorAll('audio').forEach(a=>a.pause());window.speechSynthesis&&speechSynthesis.cancel()}const tb=O().timebox;if(tb&&Date.now()-V.t0>tb*60000){V.t0=Date.now();setTimeout(()=>alert('Timebox reached: '+tb+' minutes of study. Time for a break!'),60)}V.undo={c,s:{...c},d:today()};(S.log=S.log||[]).push([c.id,Date.now(),g]);if(S.log.length>30000)S.log.splice(0,5000);c.reps=(c.reps||0)+1;Object.assign(c,{state:r.state,step:r.step,ivl:r.ivl,ease:r.ease,lapses:r.lapses,due:Date.now()+r.due,s:r.s,d:r.d,last:Date.now()});
 S.rev[today()]=(S.rev[today()]||0)+1;save();V.show=false;V.cur=queue(V.study)[0]||null;render()}
function render(){
 const hd=$('hd'),mn=$('mn'),nv=$('nv');hd.className='';mn.className='';hd.hidden=false;
 nv.hidden=V.study!=null;
 nv.innerHTML=[['decks','▤','Decks'],['browse','⌕','Browse'],['stats','▥','Stats'],['more','⚙︎','More']].map(t=>`<button class="${V.tab==t[0]?'on':''}" onclick="V.study=null;V.tab='${t[0]}';render()"><span>${t[1]}</span>${t[2]}</button>`).join('');
 if(V.study!=null){renderStudy(hd,mn);hydrate();return}
 if(V.tab=='decks'){hd.innerHTML='<span style="display:flex;align-items:center"><img src="'+(V.logo||'')+'" alt="" style="width:28px;height:28px;border-radius:7px;margin-right:8px">Hodhodi</span><button onclick="newDeck()">New deck</button>';
  const all=counts(null);
  mn.innerHTML=(navigator.standalone||S.hint?'':'<div class="card2" style="font-size:14px">To install: tap Share, then Add to Home Screen. <button onclick="S.hint=1;save();render()">Got it</button></div>')+'<div class="row hdr"><b>Deck</b><div class="cn"><span class="n">New</span><span class="l">Learn</span><span class="r">Due</span></div></div>'+S.decks.map(d=>{const c=counts(d.id),tot=S.cards.filter(x=>x.deck==d.id).length;
   return `<div class="row" onclick="startStudy(${d.id})"><div style="min-width:0"><div class="t">${esc(d.name)}</div>${O().compact?'':'<div class="sub">'+tot+' cards</div>'}</div><div class="cn"><span class="n ${c.n?'':'z'}">${c.n}</span><span class="l ${c.l?'':'z'}">${c.l}</span><span class="r ${c.r?'':'z'}">${c.r}</span></div><button onclick="event.stopPropagation();deckMenu(${d.id})">⚙︎</button></div>`}).join('')+'<div class="acts"><a href="https://ankiweb.net/shared/decks" target="_blank" rel="noopener">Get Shared</a><button onclick="newDeck()">Create Deck</button><button onclick="pickTxt()">Import File</button></div><div class="sub" style="text-align:center">Blue: new · Red: learning · Green: review</div><button class="fab" onclick="editCard()">+</button>'}
 else if(V.tab=='browse'){hd.innerHTML='<span>Browse</span>';
  const q=V.q.trim().toLowerCase();let a=S.cards;
  if(q){a=a.filter(c=>q.split(/\s+/).every(w=>{if(w=='is:due')return c.state!='new'&&c.due<=eod();if(w=='is:new')return c.state=='new';if(w=='is:suspended')return c.susp;if(w.startsWith('tag:'))return(c.tags||'').toLowerCase().includes(w.slice(4));if(w.startsWith('deck:')){const d=S.decks.find(d=>d.id==c.deck);return d&&d.name.toLowerCase().includes(w.slice(5))}return nz((c.front+' '+c.back+' '+c.tags).toLowerCase()).includes(nz(w))}))}
  mn.innerHTML=`<input id="q" placeholder="Search · tag:x · is:due · is:new · deck:x" value="${esc(V.q)}" oninput="V.q=this.value;clearTimeout(V.t);V.t=setTimeout(()=>{render();const i=$('q');i.focus();i.setSelectionRange(99,99)},250)"><div class="sub" style="margin-bottom:8px">${a.length} cards</div>`+a.slice(0,200).map(c=>`<div class="row" onclick="editCard(${c.id})"><div style="min-width:0"><div class="t">${esc(c.front.replace(/\{\{c\d+::(.*?)\}\}/g,'$1'))}</div><div class="sub">${esc((S.decks.find(d=>d.id==c.deck)||{}).name||'')} · ${c.state=='new'?'new':c.state=='learn'?'learning':'due in '+fmt(Math.max(0,c.due-Date.now()))}${c.susp?' · suspended':''}</div></div></div>`).join('')+'<button class="fab" onclick="editCard()">+</button>'}
 else if(V.tab=='stats')renderStats(hd,mn);
 else if(V.tab=='prefs')renderPrefs(hd,mn);else renderMore(hd,mn)}
function renderStudy(hd,mn){const d=S.decks.find(x=>x.id==V.study),c=V.cur,k=counts(V.study);
 hd.innerHTML=`<button onclick="V.study=null;render()">‹ Decks</button><span class="cn"><span class="n">${k.n}</span><span class="l">${k.l}</span><span class="r">${k.r}</span></span><span>${c?`<button onclick="speak()">🔊</button><button onclick="editCard(${c.id},1)">Edit</button>`:''}</span>`;
 hd.hidden=!!O().hideTop;hd.className='tb';mn.className='paper';hd.innerHTML=TB();if(!c){mn.innerHTML='<div class="empty"><div style="font-size:44px">🎉</div><b>Congratulations!</b><br>You have finished this deck for now.</div>';return}
 const cz=hasCl(c.front);const m=c.m||{};let f='<div>'+cl(c.front,V.show&&cz)+'</div>'+mediaHtml(m.fi,m.fa,'f');
